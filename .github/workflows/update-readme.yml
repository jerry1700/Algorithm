name: Update README

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 풀이 현황 집계
        run: python3 scripts/update_readme.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi

          git add README.md
          git commit -m "docs: 풀이 현황 자동 갱신"
          git push
